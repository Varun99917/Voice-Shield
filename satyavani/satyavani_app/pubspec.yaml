name: satyavani_app
description: "AI-Powered Voice Clone Detection System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  
  # WebSocket for real-time
  web_socket_channel: ^2.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Charts
  fl_chart: ^0.68.0
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  
  # Utils
  intl: ^0.19.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
